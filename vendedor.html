<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GyC Store — Vendedor</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vendedor.css">
</head>
<body>

  <div class="app-wrapper">

    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="topbar-title">GyC Store</span>
        <span class="badge-cap" id="badge-cap" style="display:none;">Capacitación</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-user" id="topbar-user"></span>
        <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
      </div>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" onclick="mostrarTab('venta', this)">Venta</button>
      <button class="tab-btn" onclick="mostrarTab('historial', this)">Historial</button>
      <button class="tab-btn" onclick="mostrarTab('reporte', this)">Reporte PDF</button>
    </nav>

    <!-- TAB VENTA -->
    <div id="tab-venta" class="tab-content">

      <div class="card">
        <p class="correlativo-info" id="correlativo-info">Cargando...</p>

        <div class="form-row">
          <div class="form-group">
            <label>SKU</label>
            <div class="sku-input-wrapper">
              <input type="text" id="sku-input" placeholder="Ej. GYC-001" onkeydown="if(event.key==='Enter') buscarSKU()">
              <button class="btn-buscar" onclick="buscarSKU()">Buscar</button>
            </div>
          </div>
          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" id="cantidad-input" value="1" min="1" placeholder="1">
          </div>
        </div>

        <div id="producto-info" class="producto-info" style="display:none;"></div>

        <div class="form-group">
          <label>Monto ($)</label>
          <input type="number" id="monto-input" placeholder="0.00" step="0.01">
        </div>

        <button class="btn-agregar" onclick="agregarAlCarrito()">+ Agregar al carrito</button>
      </div>

      <div class="card" id="carrito-card" style="display:none;">
        <div class="carrito-header">
          <p class="card-title">Carrito</p>
          <span class="carrito-count" id="carrito-count">0 productos</span>
        </div>
        <div id="carrito-items"></div>
        <div class="carrito-total">
          <span>Total</span>
          <span class="total-amount" id="total-amount">$0.00</span>
        </div>
      </div>

      <div class="card" id="pago-card" style="display:none;">
        <div class="form-group">
          <label>Tipo de pago</label>
          <div class="tipo-pago-group">
            <button class="btn-pago active" onclick="seleccionarPago('Efectivo', this)">Efectivo</button>
            <button class="btn-pago" onclick="seleccionarPago('Transferencia', this)">Transferencia</button>
            <button class="btn-pago" onclick="seleccionarPago('Tarjeta', this)">Tarjeta</button>
          </div>
        </div>
        <div class="form-group">
          <label>Notas (opcional)</label>
          <input type="text" id="notas-input" placeholder="Ej. cliente frecuente">
        </div>
        <div class="btns-venta">
          <button class="btn-cancelar-venta" onclick="cancelarVenta()">Cancelar venta</button>
          <button class="btn-registrar" onclick="registrarVenta()">Registrar venta</button>
        </div>
      </div>

      <div class="card">
        <p class="card-title">Últimas ventas</p>
        <div id="ultimas-ventas"><p class="empty-msg">Sin ventas hoy</p></div>
      </div>

    </div>

    <!-- TAB HISTORIAL -->
    <div id="tab-historial" class="tab-content" style="display:none;">
      <div class="card">
        <p class="card-title">Filtrar ventas</p>
        <div class="form-row">
          <div class="form-group">
            <label>Día</label>
            <input type="date" id="filtro-fecha">
          </div>
          <div class="form-group">
            <label>Mes</label>
            <input type="month" id="filtro-mes">
          </div>
        </div>
        <button class="btn-buscar-hist" onclick="filtrarVentas()">Buscar</button>
      </div>
      <div id="historial-resultado"></div>
    </div>

    <!-- TAB REPORTE -->
    <div id="tab-reporte" class="tab-content" style="display:none;">
      <div class="card">
        <p class="card-title">Generar reporte PDF</p>
        <div class="form-group">
          <label>Filtrar por día</label>
          <input type="date" id="reporte-fecha">
        </div>
        <div class="form-group">
          <label>Filtrar por mes</label>
          <input type="month" id="reporte-mes">
        </div>
        <button class="btn-registrar" onclick="generarReporte()">Generar y descargar PDF</button>
      </div>
    </div>

  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <script src="js/app.js"></script>
  <script src="js/vendedor.js"></script>
</body>
</html>
